name: Build CatRun iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Switching to $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          # Ensure compatibility if running on Xcode 15
          XCODE_MAJOR=$(xcodebuild -version | head -n 1 | awk '{print $2}' | cut -d. -f1)
          if [ "$XCODE_MAJOR" -lt 16 ]; then
            sed -i '' 's/objectVersion = 77;/objectVersion = 60;/g' CatRun.xcodeproj/project.pbxproj || true
          fi

      - name: Build App (Unsigned)
        run: |
          xcodebuild build \
            -project CatRun.xcodeproj \
            -scheme CatRun \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "CatRun.app")
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/

          WIDGET_PLIST="Payload/CatRun.app/PlugIns/CatWidget.appex/Info.plist"
          if [ -f "$WIDGET_PLIST" ]; then
            echo "--- CatWidget Info.plist verification ---"
            plutil -p "$WIDGET_PLIST" || true

            # Ensure NSExtension dictionary is strictly present
            /usr/libexec/PlistBuddy -c "Add :NSExtension dict" "$WIDGET_PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSExtension:NSExtensionPointIdentifier string com.apple.widgetkit-extension" "$WIDGET_PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :NSExtension:NSExtensionPointIdentifier com.apple.widgetkit-extension" "$WIDGET_PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :CFBundlePackageType XPC!" "$WIDGET_PLIST" 2>/dev/null || true

            echo "--- CatWidget Info.plist final check ---"
            plutil -p "$WIDGET_PLIST"
          else
            echo "Warning: Widget plist not found at $WIDGET_PLIST"
          fi

          zip -qr "CatRun.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CatRun-iPhone15-DynamicIsland
          path: CatRun.ipa
          retention-days: 7
