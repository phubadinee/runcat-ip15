name: Build CatRun iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App (Unsigned)
        run: |
          xcodebuild build \
            -project CatRun.xcodeproj \
            -scheme CatRun \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "CatRun.app")
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -qr "CatRun.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CatRun-iPhone15-DynamicIsland
          path: CatRun.ipa
          retention-days: 7
