name: Build CatRun iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project CatRun.xcodeproj \
            -scheme CatRun \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/CatRun.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r "build/CatRun.xcarchive/Products/Applications/CatRun.app" Payload/
          zip -qr "CatRun.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CatRun-iPhone15-DynamicIsland
          path: CatRun.ipa
          retention-days: 7
