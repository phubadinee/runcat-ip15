name: CatRun
options:
  bundleIdPrefix: com.custom.runcat
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: "NO"
    INFOPLIST_KEY_NSSupportsLiveActivities: "YES"
    INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: "YES"

targets:
  CatRun:
    type: application
    platform: iOS
    sources:
      - path: CatRun
        excludes:
          - "Info.plist"
      - path: Shared
    info:
      path: CatRun/Info.plist
      properties:
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.custom.runcat
        INFOPLIST_FILE: CatRun/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_KEY_NSSupportsLiveActivities: "YES"
        INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: "YES"
    dependencies:
      - target: CatWidget
        embed: true

  CatWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CatWidget
        excludes:
          - "Info.plist"
      - path: Shared
    info:
      path: CatWidget/Info.plist
      properties:
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.custom.runcat.CatWidget
        INFOPLIST_FILE: CatWidget/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_KEY_NSSupportsLiveActivities: "YES"

schemes:
  CatRun:
    build:
      targets:
        CatRun: all
        CatWidget: all
