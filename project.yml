name: CatRun
options:
  bundleIdPrefix: com.custom.runcat
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  CatRun:
    type: application
    platform: iOS
    sources:
      - path: CatRun
        excludes:
          - "Info.plist"
      - path: Shared
    info:
      path: CatRun/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.custom.runcat
    dependencies:
      - target: CatWidget
        embed: true

  CatWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CatWidget
        excludes:
          - "Info.plist"
      - path: Shared
    info:
      path: CatWidget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.custom.runcat.CatWidget

schemes:
  CatRun:
    build:
      targets:
        CatRun: all
        CatWidget: all
